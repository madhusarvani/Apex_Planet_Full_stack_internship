<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BrandFlow</title>
    <!-- Bootstrap + Icons + Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar with logo for consistency -->
    <nav class="navbar navbar-expand-lg sticky-top custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="dashboard.html">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" 
                     alt="Logo" width="28" height="28" class="me-2" style="border-radius: 50%;">
                <span>✨ BrandFlow</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="edit_profile.html">Edit Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Dashboard Content (only visible if logged in) -->
    <div class="container py-5" id="dashboardContent" style="display: none;">
        <div class="row">
            <div class="col-12 text-center mb-4">
                <div class="display-1 text-primary"><i class="bi bi-person-circle"></i></div>
                <h1 class="display-5 fw-bold">Welcome, <span id="usernameDisplay">User</span>!</h1>
                <p class="lead">You have successfully logged in to your dashboard.</p>
            </div>
            <div class="col-md-6 mx-auto">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h5 class="card-title"><i class="bi bi-info-circle-fill text-primary"></i> Account Details</h5>
                        <ul class="list-group list-group-flush mt-3">
                            <li class="list-group-item d-flex justify-content-between">
                                <span>Status:</span>
                                <span class="badge bg-success">Active</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between">
                                <span>Member since:</span>
                                <span id="memberSince">—</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between">
                                <span>Session ID:</span>
                                <span id="sessionId" class="text-muted small">—</span>
                            </li>
                        </ul>
                        <!-- REAL Edit Profile button (links to functional page) -->
                        <a href="edit_profile.html" class="btn btn-primary w-100 mt-4 rounded-pill">
                            <i class="bi bi-pencil-square"></i> Edit Profile
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner (while checking session) -->
    <div class="container d-flex justify-content-center align-items-center flex-grow-1" id="loadingSpinner">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Checking authentication...</span>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white-50 text-center py-3 mt-auto">
        <small>&copy; 2026 BrandFlow. All rights reserved.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Dashboard session check and logout
        (async function checkSession() {
            try {
                const response = await fetch('php/session_check.php');
                const data = await response.json();
                
                if (data.logged_in) {
                    // Show dashboard content, hide spinner
                    document.getElementById('loadingSpinner').style.display = 'none';
                    document.getElementById('dashboardContent').style.display = 'block';
                    document.getElementById('usernameDisplay').innerText = data.username;
                    document.getElementById('memberSince').innerText = data.member_since || 'Today';
                    document.getElementById('sessionId').innerText = data.session_id || 'N/A';
                } else {
                    // Not logged in → redirect to login page
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('Session check failed:', error);
                window.location.href = 'login.html';
            }
        })();

        // Logout button
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const response = await fetch('php/logout.php');
            if (response.ok) {
                window.location.href = 'login.html';
            } else {
                alert('Logout failed. Please try again.');
            }
        });
    </script>
</body>
</html>
